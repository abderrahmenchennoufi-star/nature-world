<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الطبيعة</title><style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef7ee;
        color: #23432b;
        text-align: center;
    }

    header {
        background: #176b3a;
        color: white;
        padding: 30px 15px;
    }

    header h1 {
        font-size: 32px;
    }

    .intro {
        padding: 20px;
    }

    .videos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .video {
        background: white;
        border-radius: 15px;
        padding: 12px;
        box-shadow: 0 4px 10px #0002;
    }

    iframe {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: none;
        border-radius: 10px;
    }

    footer {
        background: #176b3a;
        color: white;
        padding: 20px;
        margin-top: 20px;
    }
</style>

</head><body><header>
    <h1>🌿 عالم الطبيعة 🌿</h1>
    <p>اكتشف جمال الغابات والبحار والشلالات</p>
</header>

<section class="intro">
    <h2>مرحبًا بك في عالم الطبيعة</h2>
    <p>استمتع بمشاهدة أجمل المناظر الطبيعية حول العالم.</p>
</section>

<section class="videos">

    <div class="video">
        <h3>🌲 جمال الغابات</h3>
        <iframe
            src="https://www.youtube-nocookie.com/embed/LXb3EKWsInQ"
            title="مناظر طبيعية"
            allowfullscreen>
        </iframe>
    </div>

    <div class="video">
        <h3>🌊 البحار والمحيطات</h3>
        <iframe
            src="https://www.youtube-nocookie.com/embed/ScMzIvxBSi4"
            title="فيديو عن الطبيعة"
            allowfullscreen>
        </iframe>
    </div>

    <div class="video">
        <h3>🏞️ مناظر طبيعية خلابة</h3>
        <iframe
            src="https://www.youtube-nocookie.com/embed/ysz5S6PUM-U"
            title="مناظر جميلة"
            allowfullscreen>
        </iframe>
    </div>

</section>

<footer>
    <p>🌱 حافظ على الطبيعة، فهي بيتنا الجميل 🌱</p>
    <p>© 2026 عالم الطبيعة</p>
</footer>

</body>
</html>
